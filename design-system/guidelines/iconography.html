<!-- @dsCard group="Imagery" viewport="700x330" name="Iconography" subtitle="Lucide · 2px stroke · 24 grid · round caps" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;font-family:var(--font-sans);color:var(--color-text)}.mono{font-family:var(--font-mono)}.k{font:700 11.5px/1.2 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted)}img{display:block}</style></head><body><div id="g" style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px"></div><script>const L='https://unpkg.com/lucide-static@0.469.0/icons/';const I=[['file-text','Trámites'],['heart-pulse','Salud'],['graduation-cap','Educación'],['shield-check','Seguridad'],['trophy','Deporte'],['map','Turismo'],['drama','Cultura'],['construction','Obras'],['traffic-cone','Tránsito'],['credit-card','Pagos'],['gift','Beneficios'],['hand-heart','Adulto mayor'],['users','Familia'],['store','Emprende'],['wheat','Agricultura'],['siren','Emergencia'],['files','Documentos'],['calendar-days','Calendario'],['map-pin','Ubicación'],['phone','Teléfono'],['message-circle','WhatsApp'],['bell','Avisos'],['landmark','Municipio'],['accessibility','Accesibilidad']];const g=document.getElementById('g');I.forEach(([n,l])=>{const d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;background:var(--neutral-50);color:var(--blue-700)';d.innerHTML='<span style="width:28px;height:28px;display:block"></span><span style="font-size:11.5px;color:var(--neutral-700);font-weight:600;text-align:center">'+l+'</span>';g.appendChild(d);fetch(L+n+'.svg').then(r=>r.text()).then(t=>{d.firstChild.innerHTML=t.replace('width="24"','width="28"').replace('height="24"','height="28"')})});</script></body></html>
