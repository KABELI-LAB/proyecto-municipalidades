<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;font-family:var(--font-sans);color:var(--color-text)}.mono{font-family:var(--font-mono)}.k{font:700 11.5px/1.2 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div data-theme="light" style="background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><span class="k" style="color:var(--color-text-secondary)">light</span><b style="font-size:19px;line-height:1.25">Permiso de circulación</b><span style="font-size:14px;color:var(--color-text-secondary)">Demora 10 minutos · En línea</span><span style="display:inline-flex;align-self:flex-start;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;background:var(--color-primary);color:var(--color-text-inverse);font-weight:700">Iniciar</span><a href="#" style="font-size:15px">Ver requisitos</a></div><div data-theme="dark" style="background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><span class="k" style="color:var(--color-text-secondary)">dark</span><b style="font-size:19px;line-height:1.25">Permiso de circulación</b><span style="font-size:14px;color:var(--color-text-secondary)">Demora 10 minutos · En línea</span><span style="display:inline-flex;align-self:flex-start;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;background:var(--color-primary);color:var(--color-text-inverse);font-weight:700">Iniciar</span><a href="#" style="font-size:15px">Ver requisitos</a></div><div data-theme="high-contrast" style="background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><span class="k" style="color:var(--color-text-secondary)">high-contrast</span><b style="font-size:19px;line-height:1.25">Permiso de circulación</b><span style="font-size:14px;color:var(--color-text-secondary)">Demora 10 minutos · En línea</span><span style="display:inline-flex;align-self:flex-start;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;background:var(--color-primary);color:var(--color-text-inverse);font-weight:700">Iniciar</span><a href="#" style="font-size:15px">Ver requisitos</a></div></div></body></html>
