<html lang="es">
<head><meta charset="utf-8"><title>Tarjeta</title></head>
<body>
<div class="mh-pad" style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
  <div class="mh-tarjeta">
    <div class="mh-bloque" style="border-top:0;padding-top:0"><h3>Permanente</h3><p>Pertenece a la comuna y no a una administración en particular.</p></div>
  </div>
  <div class="mh-tarjeta" style="display:flex;flex-direction:column;gap:20px">
    <div class="mh-bloque" style="border-top:0;padding-top:0"><h3>No partidista</h3><p>Sin nombres, fotografías, firmas, lemas ni colores de autoridades o partidos.</p></div>
    <div class="mh-bloque"><h3>Clara y accesible</h3><p>Reconocible, confiable y comprensible para todas las personas, sobre todo en una emergencia.</p></div>
  </div>
</div>
