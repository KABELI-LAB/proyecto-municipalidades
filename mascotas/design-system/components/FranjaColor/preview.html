<!-- @dsCard group="Color" height=300 width=1400 subtitle="Proporción de uso 45 · 30 · 15 · 10" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>FranjaColor</title></head>
<body>
<div class="mh-pad mh-sobre-blanco" style="display:flex;flex-direction:column;gap:24px">
  <div class="mh-franja">
    <i style="flex:45;background:var(--azul-institucional)"></i><i style="flex:30;background:var(--gris-claro)"></i><i style="flex:15;background:var(--verde-territorio)"></i><i style="flex:4;background:var(--celeste-rio)"></i><i style="flex:3;background:var(--terracota)"></i><i style="flex:3;background:var(--amarillo-senal)"></i>
  </div>
  <div style="display:flex;gap:16px">
    <div style="flex:45"><div style="font-family:var(--font-titulos);font-size:44px;font-weight:700;line-height:1.4;color:var(--azul-institucional)">45 %</div><div style="font-size:24px">Azul institucional</div></div>
    <div style="flex:30"><div style="font-family:var(--font-titulos);font-size:44px;font-weight:700;line-height:1.4;color:var(--azul-institucional)">30 %</div><div style="font-size:24px">Marfil, blanco y grises</div></div>
    <div style="flex:15"><div style="font-family:var(--font-titulos);font-size:44px;font-weight:700;line-height:1.4;color:var(--azul-institucional)">15 %</div><div style="font-size:24px">Verde territorio</div></div>
    <div style="flex:10"><div style="font-family:var(--font-titulos);font-size:44px;font-weight:700;line-height:1.4;color:var(--azul-institucional)">10 %</div><div style="font-size:24px">Acentos</div></div>
  </div>
  <div class="mh-franja mh-franja--pie" style="margin:0 -40px -40px">
    <i style="flex:45;background:var(--azul-institucional)"></i><i style="flex:15;background:var(--verde-territorio)"></i><i style="flex:4;background:var(--celeste-rio)"></i><i style="flex:3;background:var(--terracota)"></i><i style="flex:3;background:var(--amarillo-senal)"></i>
  </div>
</div>
</body>
</html>
