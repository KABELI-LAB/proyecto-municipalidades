<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;font-family:var(--font-sans);color:var(--color-text)}.mono{font-family:var(--font-mono)}.k{font:700 11.5px/1.2 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted)}img{display:block}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;height:170px">
<div style="background:#fff;border:1px solid var(--color-border);border-radius:14px;display:grid;place-items:center"><img src="../assets/logo/wordmark-somos-todos.png" style="width:78%"></div>
<div style="background:var(--blue-700);border-radius:14px;display:grid;place-items:center"><img src="../assets/logo/logo-vertical-white.png" style="height:130px"></div>
<div style="background:var(--blue-900);border-radius:14px;display:grid;place-items:center"><img src="../assets/logo/wordmark.png" style="width:72%;filter:brightness(0) invert(1)"></div>
<div style="background:url(../assets/photos/municipalidad-fachada.jpg) center/cover;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:end start;padding:12px"><div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,21,51,.75),transparent 70%)"></div><img src="../assets/logo/wordmark.png" style="position:relative;width:62%;filter:brightness(0) invert(1)"></div></div></body></html>
