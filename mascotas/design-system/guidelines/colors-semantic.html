<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;font-family:var(--font-sans);color:var(--color-text)}.mono{font-family:var(--font-mono)}.k{font:700 11.5px/1.2 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted)}</style></head><body><div style="display:flex;gap:10px"><div style="flex:1;background:#E6F4EA;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px"><span style="width:30px;height:30px;border-radius:50%;background:#1F7A36;color:#fff;display:grid;place-items:center;font-weight:800">✓</span><b style="font-size:17px">Success</b><span class="mono" style="font-size:12px;color:var(--color-text-secondary)">fg #1F7A36 · bg #E6F4EA · 5.4:1</span></div><div style="flex:1;background:#FEF4BF;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px"><span style="width:30px;height:30px;border-radius:50%;background:#FAC22F;color:#0D1533;display:grid;place-items:center;font-weight:800">!</span><b style="font-size:17px">Warning</b><span class="mono" style="font-size:12px;color:var(--color-text-secondary)">fill #FAC22F · text #9E5F05 · bg #FEF4BF</span></div><div style="flex:1;background:#FCEAEA;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px"><span style="width:30px;height:30px;border-radius:50%;background:#C42B2B;color:#fff;display:grid;place-items:center;font-weight:800">×</span><b style="font-size:17px">Error</b><span class="mono" style="font-size:12px;color:var(--color-text-secondary)">fg #C42B2B · bg #FCEAEA · 5.6:1</span></div><div style="flex:1;background:#EEF3FB;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px"><span style="width:30px;height:30px;border-radius:50%;background:#1A58A0;color:#fff;display:grid;place-items:center;font-weight:800">i</span><b style="font-size:17px">Information</b><span class="mono" style="font-size:12px;color:var(--color-text-secondary)">fg #1A58A0 · bg #EEF3FB · 7.1:1</span></div></div></body></html>
