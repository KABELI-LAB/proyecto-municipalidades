<!-- @dsCard group="Motion" viewport="700x240" name="Motion" subtitle="Flujo — progress, state, transition, confirmation" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;font-family:var(--font-sans);color:var(--color-text)}.mono{font-family:var(--font-mono)}.k{font:700 11.5px/1.2 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted)}img{display:block}@keyframes mv{0%,15%{left:6px}50%,65%{left:calc(100% - 34px)}100%{left:6px}}.d0{animation:mv 1.6s var(--ease-flow) infinite}.d1{animation:mv 2.4s var(--ease-flow) infinite}.d2{animation:mv 3.4s var(--ease-flow) infinite}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div style="border:1px solid var(--color-border);border-radius:16px;padding:14px"><div style="height:40px;background:var(--neutral-100);border-radius:20px;position:relative;overflow:hidden"><div class="dot d0" style="position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--blue-700)"></div></div><b class="mono" style="display:block;margin-top:10px;font-size:13px">Micro · 120ms</b><span style="font-size:13px;color:var(--color-text-secondary)">hover, press, toggle</span></div><div style="border:1px solid var(--color-border);border-radius:16px;padding:14px"><div style="height:40px;background:var(--neutral-100);border-radius:20px;position:relative;overflow:hidden"><div class="dot d1" style="position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--blue-700)"></div></div><b class="mono" style="display:block;margin-top:10px;font-size:13px">Standard · 240ms</b><span style="font-size:13px;color:var(--color-text-secondary)">abrir, cambiar estado, entrar</span></div><div style="border:1px solid var(--color-border);border-radius:16px;padding:14px"><div style="height:40px;background:var(--neutral-100);border-radius:20px;position:relative;overflow:hidden"><div class="dot d2" style="position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--blue-700)"></div></div><b class="mono" style="display:block;margin-top:10px;font-size:13px">Complex · 420ms</b><span style="font-size:13px;color:var(--color-text-secondary)">cambio de pantalla, gráficos</span></div></div>
<div style="display:flex;gap:16px;margin-top:12px;font-size:13px;align-items:center"><span class="mono" style="background:var(--neutral-100);padding:6px 10px;border-radius:8px">ease-flow cubic-bezier(.2,0,0,1)</span><span style="color:var(--color-text-secondary)">Arranque decidido, llegada larga — como el agua que se nivela. Sin rebotes. Respeta <span class="mono">prefers-reduced-motion</span>.</span></div></body></html>
