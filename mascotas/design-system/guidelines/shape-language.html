<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;font-family:var(--font-sans);color:var(--color-text)}.mono{font-family:var(--font-mono)}.k{font:700 11.5px/1.2 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted)}img{display:block}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div><div style="height:150px;border-radius:16px;overflow:hidden;background:var(--blue-900)"><svg viewBox="0 0 1200 400" preserveAspectRatio="none" style="display:block;width:100%;height:100%"><path d="M-40 270 C 260 270, 470 140, 760 120 S 1120 106, 1240 106" fill="none" stroke="#1270B7" stroke-width="20" vector-effect="non-scaling-stroke"/><path d="M-40 340 C 260 340, 470 210, 760 190 S 1120 176, 1240 176" fill="none" stroke="#fff" stroke-width="20" vector-effect="non-scaling-stroke"/><path d="M-40 410 C 260 410, 470 280, 760 260 S 1120 246, 1240 246" fill="none" stroke="#3AAA35" stroke-width="20" vector-effect="non-scaling-stroke"/></svg></div><b style="display:block;margin-top:8px">Cauce</b><span style="font-size:13px;color:var(--color-text-secondary)">Las ondas del escudo. Fondos, separadores, progreso, transiciones.</span></div>
<div><div style="height:150px;border-radius:16px;overflow:hidden;background:var(--neutral-50);position:relative"><div style="position:absolute;left:24px;right:24px;bottom:0;top:30px;background:var(--blue-700);clip-path:polygon(0 18%,100% 0,100% 100%,0 100%)"></div><div style="position:absolute;left:24px;top:54px;width:60px;height:28px;background:var(--yellow-400);clip-path:polygon(0 30%,100% 0,100% 100%,0 100%)"></div></div><b style="display:block;margin-top:8px">Corte</b><span style="font-size:13px;color:var(--color-text-secondary)">El remate inclinado de H, u, l. Bloques de título, overline, máscaras.</span></div>
<div><div style="height:150px;border-radius:16px;overflow:hidden;background:var(--green-700);display:grid;place-items:center"><svg viewBox="0 0 200 100" style="width:70%"><path d="M10 90 C 50 20, 150 20, 190 90" fill="none" stroke="#FAC22F" stroke-width="16" stroke-linecap="round"/></svg></div><b style="display:block;margin-top:8px">Arco</b><span style="font-size:13px;color:var(--color-text-secondary)">La tilde de la ñ. Acentos de foco, loaders, “aquí estás”.</span></div></div></body></html>
