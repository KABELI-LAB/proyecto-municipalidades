<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;font-family:var(--font-sans);color:var(--color-text)}.mono{font-family:var(--font-mono)}.k{font:700 11.5px/1.2 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted)}body{background:var(--neutral-50)}</style></head><body><div style="display:flex;gap:20px;padding:6px"><div style="flex:1;height:110px;border-radius:20px;background:#fff;border:1px solid var(--color-border);box-shadow:none;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px"><b class="mono" style="font-size:13px">border</b><span style="font-size:12.5px;color:var(--color-text-secondary)">none · 1px neutral-200</span></div><div style="flex:1;height:110px;border-radius:20px;background:#fff;border:0;box-shadow:var(--shadow-small);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px"><b class="mono" style="font-size:13px">shadow.small</b><span style="font-size:12.5px;color:var(--color-text-secondary)">chips flotantes, header sticky</span></div><div style="flex:1;height:110px;border-radius:20px;background:#fff;border:0;box-shadow:var(--shadow-medium);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px"><b class="mono" style="font-size:13px">shadow.medium</b><span style="font-size:12.5px;color:var(--color-text-secondary)">card hover, menús</span></div><div style="flex:1;height:110px;border-radius:20px;background:#fff;border:0;box-shadow:var(--shadow-large);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px"><b class="mono" style="font-size:13px">shadow.large</b><span style="font-size:12.5px;color:var(--color-text-secondary)">modal, drawer, tótem</span></div></div></body></html>
